<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ r.title }} · 사고수리 검색 진단 리포트</title>
<style>
@font-face{font-family:'Pretendard';src:url('{{ font_url }}') format('woff2');font-weight:100 900;font-display:block}
@page{size:794px 1123px;margin:0}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#ffffff}
body{font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif;color:#1B2433;word-break:keep-all;overflow-wrap:break-word;-webkit-print-color-adjust:exact;print-color-adjust:exact}
ul{margin:0;padding-left:18px}
b{font-weight:700}
span.hot,b.hot{color:#B4501F;font-weight:700}

/* 판형 */
.page{width:794px;height:1123px;padding:48px;background:#ffffff;display:flex;flex-direction:column;gap:24px;overflow:hidden;position:relative;break-after:page;page-break-after:always}
.page:last-child{break-after:auto;page-break-after:auto}
@media screen{body{background:#e9e9e9;padding:24px 0}.page{margin:0 auto 24px;box-shadow:0 2px 14px rgba(0,0,0,.10)}}
@media print{body{background:#ffffff;padding:0}.page{margin:0;box-shadow:none}}

/* 공통 */
.hdr{display:flex;justify-content:space-between;align-items:center;font-size:12px;line-height:16px;color:#5E6675}
.hdr-l{display:flex;align-items:center;gap:6px}
.hdr-l b{color:#1C2A76}
.title{display:flex;flex-direction:column;gap:8px}
.title h1{margin:0;font-size:28px;line-height:38px;font-weight:900;letter-spacing:-0.02em}
.lede{margin:0;font-size:14px;line-height:22px;color:#5E6675}
.eyebrow{font-size:12px;line-height:16px;font-weight:700;letter-spacing:0.08em;color:#5E6675}
.eyebrow.hot{color:#B4501F}
.sec{display:flex;flex-direction:column;gap:10px}
.foot{margin-top:auto;padding-top:12px;border-top:1px solid #DDD8CC;display:flex;justify-content:space-between;gap:16px;font-size:12px;line-height:18px;color:#5E6675}
.foot>span:last-child{white-space:nowrap;flex-shrink:0}
.muted{color:#5E6675}
.tile{padding:14px 16px;border:1px solid #DDD8CC;border-radius:10px;display:flex;flex-direction:column;gap:2px}
.tile.hot{border-color:#B4501F;background:#fdf1ea}
.tile .k{font-size:12px;line-height:16px;color:#5E6675}
.tile .v{font-size:28px;line-height:34px;font-weight:900}
.tile.hot .v{color:#B4501F}
.chip{flex:1 1 0;padding:12px 14px;background:#E9EDF3;border-radius:10px;display:flex;flex-direction:column;gap:2px}
.chip.hot{background:#fdf1ea}
.chip .k{font-size:12px;line-height:16px;color:#5E6675}
.chip .v{font-size:24px;line-height:30px;font-weight:900}
.chip.hot .v{color:#B4501F}
.card{padding:16px 18px;border:1px solid #DDD8CC;border-radius:10px;display:flex;flex-direction:column;gap:6px;flex:1 1 0;min-width:0}
.box{padding:12px 14px;background:#E9EDF3;border-radius:10px}
.box.hot{background:#fdf1ea}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.row{display:flex;gap:16px}
.bullets{display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:22px}
.bullets div{display:flex;gap:10px}
.bullets i{width:8px;height:8px;border-radius:4px;background:#1C2A76;margin-top:7px;flex-shrink:0}
.numlist{display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:23px}
.numlist div{display:flex;gap:12px}
.numlist em{width:24px;flex-shrink:0;font-style:normal;font-size:18px;line-height:23px;font-weight:900;color:#1C2A76}

/* 표 */
.tbl{display:grid;gap:1px;background:#DDD8CC;border:1px solid #DDD8CC;font-size:13px;line-height:19px}
.tbl>div{background:#ffffff;padding:7px 10px}
.tbl>.th{background:#E9EDF3;font-size:12px;font-weight:700;color:#5E6675}
.tbl .r{text-align:right}.tbl .c{text-align:center}.tbl .b{font-weight:700}
.tbl .hotrow{background:#fdf1ea}
.tbl.small{font-size:12px;line-height:17px}.tbl.small>div{padding:7px 8px}
.v-x{font-weight:700;color:#B4501F}.v-o{font-weight:700;color:#1C2A76}.v-d{font-weight:700}

/* 막대 */
.bar{flex:1 1 0;height:14px;display:flex}
.bar>i{height:100%;background:#1C2A76;border-radius:0 4px 4px 0;display:block}
.bar>i.hot{background:#B4501F}
.bar>i.empty{background:none;border:1px dashed #8A93A8;width:100%}
.bar8{height:8px;display:flex}
.bar8>i{height:100%;border-radius:0 4px 4px 0;display:block}
.bar8>i.now{background:#B9C0D1}.bar8>i.tgt{background:#1C2A76}
</style>
</head>
<body>
{% for p in pages %}{{ p|safe }}{% endfor %}
</body>
</html>
